# Local Postgres for Deskpilot. pgvector image so KB embeddings (M2) need no swap.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: deskpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: deskpilot
      POSTGRES_PASSWORD: deskpilot
      POSTGRES_DB: deskpilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deskpilot"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
